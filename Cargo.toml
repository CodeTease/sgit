[package]
name = "sgit"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "net",
    "process",
    "signal",
    "time",
    "io-util",
    "sync",
] }
git2 = { version = "0.21", features = ["vendored-openssl"] }
bytes = "1.0"
http = "1.0"
tokio-util = { version = "0.7.19", features = ["io", "rt"] }
tokio-stream = "0.1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-core = "0.3"
tower = { version = "0.5", features = ["util", "limit"] }
tower_governor = "0.4.3"
toml = "1"
base64 = "0.23"
sha2 = "0.11.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
